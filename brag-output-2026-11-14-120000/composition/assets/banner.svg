<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2328" />
      <stop offset="45%" stop-color="#12343B" />
      <stop offset="85%" stop-color="#2D545E" />
      <stop offset="100%" stop-color="#173E47" />
    </linearGradient>
    
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1B382" />
      <stop offset="50%" stop-color="#FCEFD8" />
      <stop offset="100%" stop-color="#C89666" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194049" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E282E" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="seam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1B382" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#E1B382" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E1B382" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="glow-sand" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1B382" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E1B382" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ball-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCEFD8" />
      <stop offset="40%" stop-color="#E1B382" />
      <stop offset="80%" stop-color="#C89666" />
      <stop offset="100%" stop-color="#7A4B22" />
    </radialGradient>

    <!-- Filter for soft glow -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Stadium Pitch Boundary Circles -->
  <g opacity="0.18">
    <ellipse cx="600" cy="530" rx="680" ry="340" stroke="#E1B382" stroke-width="2" stroke-dasharray="6 8" />
    <ellipse cx="600" cy="530" rx="550" ry="270" stroke="#E1B382" stroke-width="1.5" />
    <ellipse cx="600" cy="530" rx="420" ry="210" stroke="#E1B382" stroke-width="1.5" stroke-dasharray="4 6" />
    <ellipse cx="600" cy="530" rx="280" ry="140" stroke="#E1B382" stroke-width="2" />
  </g>

  <!-- Atmospheric Glow Overlays -->
  <circle cx="200" cy="100" r="180" fill="url(#glow-sand)" />
  <circle cx="1020" cy="180" r="220" fill="url(#glow-sand)" />

  <!-- Top Decorative Seam Track -->
  <path d="M 50 20 L 1150 20" stroke="url(#seam-grad)" stroke-width="2" />
  <g opacity="0.6">
    <circle cx="600" cy="20" r="3" fill="#E1B382" />
    <circle cx="580" cy="20" r="2" fill="#E1B382" />
    <circle cx="620" cy="20" r="2" fill="#E1B382" />
  </g>

  <!-- Left Cricket Ball Graphic Vector -->
  <g transform="translate(100, 160)">
    <circle cx="45" cy="45" r="45" fill="url(#ball-glow)" filter="url(#soft-glow)" />
    <!-- Ball Seam Stitching -->
    <path d="M 12 25 Q 45 45 78 65" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 15 28 Q 45 48 75 68" stroke="#7A4B22" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
    <path d="M 9 22 Q 45 42 81 62" stroke="#7A4B22" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
  </g>

  <!-- Right Stylized Cricket Stumps & Bails -->
  <g transform="translate(1020, 125)" opacity="0.85">
    <!-- Stumps -->
    <rect x="15" y="40" width="8" height="95" rx="3" fill="#E1B382" />
    <rect x="36" y="40" width="8" height="95" rx="3" fill="#E1B382" />
    <rect x="57" y="40" width="8" height="95" rx="3" fill="#E1B382" />
    <!-- Bails -->
    <rect x="10" y="32" width="28" height="6" rx="2" fill="#FCEFD8" />
    <rect x="42" y="32" width="28" height="6" rx="2" fill="#FCEFD8" />
    <!-- Ground Crease -->
    <line x1="-10" y1="135" x2="90" y2="135" stroke="#E1B382" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Center Content -->
  <g text-anchor="middle">
    <!-- Overline Eyebrow -->
    <rect x="450" y="55" width="300" height="28" rx="14" fill="#0E2328" stroke="#2D545E" stroke-width="1.5" />
    <text x="600" y="73" fill="#E1B382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">
      ★ THE COMPLETE CRICKET PLATFORM ★
    </text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#gold-grad)" font-family="Georgia, 'Playfair Display', serif" font-size="52" font-weight="900" letter-spacing="3" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))">
      CRICKET DREAM XI
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#FBF8F2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.5">
      Deterministic Simulation Engine • WebGL 2D Stadium Visualizer • 1,144 Cricketers
    </text>

    <!-- Editorial Tagline -->
    <text x="600" y="215" fill="#D8C9B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">
      Play T10, T20, ODI &amp; 5-Day Test Matches with bit-exact replayability, 100% offline in browser.
    </text>
  </g>

  <!-- Feature Pills Strip (Bottom) -->
  <g transform="translate(130, 260)">
    <!-- Pill 1: SplitMix64 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="68" rx="12" fill="url(#card-grad)" stroke="#2D545E" stroke-width="1.5" />
      <text x="24" y="32" fill="#E1B382" font-family="sans-serif" font-size="20">⚡</text>
      <text x="56" y="30" fill="#FBF8F2" font-family="sans-serif" font-size="13" font-weight="700">SplitMix64 PRNG</text>
      <text x="56" y="48" fill="#D8C9B5" font-family="sans-serif" font-size="11">Bit-Exact Determinism</text>
    </g>

    <!-- Pill 2: 2D WebGL Stadium -->
    <g transform="translate(240, 0)">
      <rect width="210" height="68" rx="12" fill="url(#card-grad)" stroke="#2D545E" stroke-width="1.5" />
      <text x="24" y="32" fill="#E1B382" font-family="sans-serif" font-size="20">🏟️</text>
      <text x="56" y="30" fill="#FBF8F2" font-family="sans-serif" font-size="13" font-weight="700">PixiJS 8 Broadcast</text>
      <text x="56" y="48" fill="#D8C9B5" font-family="sans-serif" font-size="11">Realistic 2D Trajectories</text>
    </g>

    <!-- Pill 3: 1,144 Players -->
    <g transform="translate(480, 0)">
      <rect width="210" height="68" rx="12" fill="url(#card-grad)" stroke="#2D545E" stroke-width="1.5" />
      <text x="24" y="32" fill="#E1B382" font-family="sans-serif" font-size="20">👥</text>
      <text x="56" y="30" fill="#FBF8F2" font-family="sans-serif" font-size="13" font-weight="700">1,144 Cricketers</text>
      <text x="56" y="48" fill="#D8C9B5" font-family="sans-serif" font-size="11">6 Eras &amp; Franchise Stars</text>
    </g>

    <!-- Pill 4: MCC Law Compliant -->
    <g transform="translate(720, 0)">
      <rect width="210" height="68" rx="12" fill="url(#card-grad)" stroke="#2D545E" stroke-width="1.5" />
      <text x="24" y="32" fill="#E1B382" font-family="sans-serif" font-size="20">📜</text>
      <text x="56" y="30" fill="#FBF8F2" font-family="sans-serif" font-size="13" font-weight="700">MCC Law 2026</text>
      <text x="56" y="48" fill="#D8C9B5" font-family="sans-serif" font-size="11">Powerplays, Quotas, Tests</text>
    </g>
  </g>

  <!-- Bottom Accent Strip -->
  <path d="M 50 380 L 1150 380" stroke="url(#seam-grad)" stroke-width="1.5" />
  <g text-anchor="middle" opacity="0.8">
    <text x="600" y="402" fill="#E1B382" font-family="monospace" font-size="11" letter-spacing="1.5">
      DEEP BLUE × SAND TAN EDITORIAL MINIMALISM • ZERO SERVER LATENCY • TURBOREPO MONOREPO
    </text>
  </g>
</svg>
