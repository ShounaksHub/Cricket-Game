<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" fill="none">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194049" />
      <stop offset="100%" stop-color="#0E282E" />
    </linearGradient>
    <linearGradient id="accent-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1B382" />
      <stop offset="100%" stop-color="#C89666" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="1000" height="280" rx="14" fill="#0C2025" stroke="#2D545E" stroke-width="2" />

  <text x="500" y="32" fill="#E1B382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
    CORE INNOVATIONS & ARCHITECTURAL PILLARS
  </text>

  <!-- Pillar 1: Deterministic Engine -->
  <g transform="translate(25, 50)" filter="url(#card-shadow)">
    <rect width="220" height="205" rx="10" fill="url(#card-grad)" stroke="#2D545E" stroke-width="1.5" />
    <rect width="220" height="4" rx="2" fill="url(#accent-gold)" />
    
    <circle cx="36" cy="36" r="18" fill="#12343B" stroke="#E1B382" stroke-width="1.5" />
    <text x="36" y="42" fill="#E1B382" font-family="sans-serif" font-size="16" text-anchor="middle">⚡</text>
    <text x="64" y="34" fill="#FBF8F2" font-family="sans-serif" font-size="13" font-weight="700">SplitMix64 Engine</text>
    <text x="64" y="48" fill="#E1B382" font-family="monospace" font-size="9">BIT-EXACT PRNG</text>
    
    <line x1="16" y1="64" x2="204" y2="64" stroke="#2D545E" stroke-width="1" />
    <text x="16" y="86" fill="#D8C9B5" font-family="sans-serif" font-size="11" font-weight="600">Deterministic Seeds</text>
    <text x="16" y="102" fill="#8FA2A6" font-family="sans-serif" font-size="10">Zero server latency; identical</text>
    <text x="16" y="116" fill="#8FA2A6" font-family="sans-serif" font-size="10">match replays anywhere.</text>
    
    <text x="16" y="142" fill="#D8C9B5" font-family="sans-serif" font-size="11" font-weight="600">Immutable State Hash</text>
    <text x="16" y="158" fill="#8FA2A6" font-family="sans-serif" font-size="10">SHA-256 state ledger guards</text>
    <text x="16" y="172" fill="#8FA2A6" font-family="sans-serif" font-size="10">against desync & cheating.</text>
    
    <rect x="16" y="184" width="75" height="15" rx="3" fill="#12343B" />
    <text x="53" y="195" fill="#E1B382" font-family="monospace" font-size="8" text-anchor="middle">0ms LATENCY</text>
  </g>

  <!-- Pillar 2: PixiJS 8 Broadcast -->
  <g transform="translate(265, 50)" filter="url(#card-shadow)">
    <rect width="220" height="205" rx="10" fill="url(#card-grad)" stroke="#2D545E" stroke-width="1.5" />
    <rect width="220" height="4" rx="2" fill="url(#accent-gold)" />
    
    <circle cx="36" cy="36" r="18" fill="#12343B" stroke="#E1B382" stroke-width="1.5" />
    <text x="36" y="42" fill="#E1B382" font-family="sans-serif" font-size="16" text-anchor="middle">🏟️</text>
    <text x="64" y="34" fill="#FBF8F2" font-family="sans-serif" font-size="13" font-weight="700">PixiJS 8 WebGL</text>
    <text x="64" y="48" fill="#E1B382" font-family="monospace" font-size="9">60 FPS BROADCAST</text>
    
    <line x1="16" y1="64" x2="204" y2="64" stroke="#2D545E" stroke-width="1" />
    <text x="16" y="86" fill="#D8C9B5" font-family="sans-serif" font-size="11" font-weight="600">Dynamic Pitch & Ring</text>
    <text x="16" y="102" fill="#8FA2A6" font-family="sans-serif" font-size="10">Grass mow bands, 30-yd ring,</text>
    <text x="16" y="116" fill="#8FA2A6" font-family="sans-serif" font-size="10">and responsive field geometry.</text>
    
    <text x="16" y="142" fill="#D8C9B5" font-family="sans-serif" font-size="11" font-weight="600">Trajectory Physics</text>
    <text x="16" y="158" fill="#8FA2A6" font-family="sans-serif" font-size="10">Accurate aerial ball flight arcs,</text>
    <text x="16" y="172" fill="#8FA2A6" font-family="sans-serif" font-size="10">boundaries, & slip catches.</text>
    
    <rect x="16" y="184" width="75" height="15" rx="3" fill="#12343B" />
    <text x="53" y="195" fill="#E1B382" font-family="monospace" font-size="8" text-anchor="middle">WEBGL 2D</text>
  </g>

  <!-- Pillar 3: 1,144 Cricketers -->
  <g transform="translate(505, 50)" filter="url(#card-shadow)">
    <rect width="220" height="205" rx="10" fill="url(#card-grad)" stroke="#2D545E" stroke-width="1.5" />
    <rect width="220" height="4" rx="2" fill="url(#accent-gold)" />
    
    <circle cx="36" cy="36" r="18" fill="#12343B" stroke="#E1B382" stroke-width="1.5" />
    <text x="36" y="42" fill="#E1B382" font-family="sans-serif" font-size="16" text-anchor="middle">👥</text>
    <text x="64" y="34" fill="#FBF8F2" font-family="sans-serif" font-size="13" font-weight="700">1,144 Cricketers</text>
    <text x="64" y="48" fill="#E1B382" font-family="monospace" font-size="9">6 GLOBAL COHORTS</text>
    
    <line x1="16" y1="64" x2="204" y2="64" stroke="#2D545E" stroke-width="1" />
    <text x="16" y="86" fill="#D8C9B5" font-family="sans-serif" font-size="11" font-weight="600">4-Layer Rating Engine</text>
    <text x="16" y="102" fill="#8FA2A6" font-family="sans-serif" font-size="10">Base skills, format tuning,</text>
    <text x="16" y="116" fill="#8FA2A6" font-family="sans-serif" font-size="10">era shrinkage, and matchups.</text>
    
    <text x="16" y="142" fill="#D8C9B5" font-family="sans-serif" font-size="11" font-weight="600">Procedural Vector Art</text>
    <text x="16" y="158" fill="#8FA2A6" font-family="sans-serif" font-size="10">Unique SVG player portraits</text>
    <text x="16" y="172" fill="#8FA2A6" font-family="sans-serif" font-size="10">with authentic team kits.</text>
    
    <rect x="16" y="184" width="75" height="15" rx="3" fill="#12343B" />
    <text x="53" y="195" fill="#E1B382" font-family="monospace" font-size="8" text-anchor="middle">100% CANONICAL</text>
  </g>

  <!-- Pillar 4: Editorial Design -->
  <g transform="translate(745, 50)" filter="url(#card-shadow)">
    <rect width="230" height="205" rx="10" fill="url(#card-grad)" stroke="#2D545E" stroke-width="1.5" />
    <rect width="230" height="4" rx="2" fill="url(#accent-gold)" />
    
    <circle cx="36" cy="36" r="18" fill="#12343B" stroke="#E1B382" stroke-width="1.5" />
    <text x="36" y="42" fill="#E1B382" font-family="sans-serif" font-size="16" text-anchor="middle">📰</text>
    <text x="64" y="34" fill="#FBF8F2" font-family="sans-serif" font-size="13" font-weight="700">Editorial Design</text>
    <text x="64" y="48" fill="#E1B382" font-family="monospace" font-size="9">DEEP BLUE × SAND TAN</text>
    
    <line x1="16" y1="64" x2="214" y2="64" stroke="#2D545E" stroke-width="1" />
    <text x="16" y="86" fill="#D8C9B5" font-family="sans-serif" font-size="11" font-weight="600">Zero AI Slop</text>
    <text x="16" y="102" fill="#8FA2A6" font-family="sans-serif" font-size="10">Wisden-inspired typography,</text>
    <text x="16" y="116" fill="#8FA2A6" font-family="sans-serif" font-size="10">warm paper, & clear tables.</text>
    
    <text x="16" y="142" fill="#D8C9B5" font-family="sans-serif" font-size="11" font-weight="600">100% Offline PWA</text>
    <text x="16" y="158" fill="#8FA2A6" font-family="sans-serif" font-size="10">Works completely in-flight</text>
    <text x="16" y="172" fill="#8FA2A6" font-family="sans-serif" font-size="10">and on low-connectivity devices.</text>
    
    <rect x="16" y="184" width="75" height="15" rx="3" fill="#12343B" />
    <text x="53" y="195" fill="#E1B382" font-family="monospace" font-size="8" text-anchor="middle">OFFLINE READY</text>
  </g>
</svg>
