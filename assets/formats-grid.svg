    <text x="16" y="82" fill="#D8C9B5" font-family="sans-serif" font-size="10">• Twilight Swing +35%</text>
    <text x="16" y="100" fill="#D8C9B5" font-family="sans-serif" font-size="10">• Night Dew Factor -20%</text>
    <text x="16" y="118" fill="#D8C9B5" font-family="sans-serif" font-size="10">• Pink Lacquered Seam</text>
    <text x="16" y="142" fill="#8FA2A6" font-family="sans-serif" font-size="9" font-style="italic">Atmospheric drama</text>
  </g>
