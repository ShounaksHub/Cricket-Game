<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" fill="none">
  <defs>
    <linearGradient id="fcard-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194049" />
      <stop offset="100%" stop-color="#0E282E" />
    </linearGradient>
    <linearGradient id="t10-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1B382" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    <linearGradient id="t20-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06D6A0" />
      <stop offset="100%" stop-color="#118AB2" />
    </linearGradient>
    <linearGradient id="odi-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#118AB2" />
      <stop offset="100%" stop-color="#4EA8DE" />
    </linearGradient>
    <linearGradient id="test-red-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#9B2226" />
    </linearGradient>
    <linearGradient id="test-pink-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F72585" />
      <stop offset="100%" stop-color="#B5179E" />
