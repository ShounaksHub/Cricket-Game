    <text x="16" y="100" fill="#D8C9B5" font-family="sans-serif" font-size="10">• 80 Ov Re-Ball Decay</text>
    <text x="16" y="118" fill="#D8C9B5" font-family="sans-serif" font-size="10">• Slip Cordon Catches</text>
    <text x="16" y="142" fill="#8FA2A6" font-family="sans-serif" font-size="9" font-style="italic">Purest cricket crucible</text>
  </g>

  <!-- Card 5: Test Pink -->
  <g transform="translate(796, 52)">
    <rect width="175" height="165" rx="10" fill="url(#fcard-bg)" stroke="#2D545E" stroke-width="1.5" />
    <rect width="175" height="4" rx="2" fill="url(#test-pink-bar)" />
    <text x="16" y="30" fill="#F72585" font-family="sans-serif" font-size="18">🌸</text>
    <text x="44" y="28" fill="#FBF8F2" font-family="sans-serif" font-size="13" font-weight="700">TEST PINK</text>
